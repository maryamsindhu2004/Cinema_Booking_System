<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4 - Select Seat Type | Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cinema Booking</h1>
            <p>Book your tickets online, enjoy your movie!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step completed" data-step="1">
                <div class="progress-circle">1</div>
                <div class="progress-label">Movie</div>
            </div>
            <div class="progress-step completed" data-step="2">
                <div class="progress-circle">2</div>
                <div class="progress-label">Timing</div>
            </div>
            <div class="progress-step completed" data-step="3">
                <div class="progress-circle">3</div>
                <div class="progress-label">Screen</div>
            </div>
            <div class="progress-step active" data-step="4">
                <div class="progress-circle">4</div>
                <div class="progress-label">Seat</div>
            </div>
            <div class="progress-step" data-step="5">
                <div class="progress-circle">5</div>
                <div class="progress-label">Food</div>
            </div>
            <div class="progress-step" data-step="6">
                <div class="progress-circle">6</div>
                <div class="progress-label">Payment</div>
            </div>
            <div class="progress-step" data-step="7">
                <div class="progress-circle">7</div>
                <div class="progress-label">Confirm</div>
            </div>
        </div>

        <div class="content">
            <h2>Select Seat Type</h2>
            <div class="info-box">
                <strong>ℹ️ Choose</strong> your preferred seat category.
            </div>

            <div class="grid" id="seatGrid"></div>

            <div class="summary">
                <h3>Running Total</h3>
                <div id="runningTotal"></div>
            </div>

            <div class="button-group">
                <button class="btn-secondary" onclick="goBack()">← Back</button>
                <button class="btn-primary" id="nextBtn" onclick="goToNextStep()" disabled>Next →</button>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/booking.js"></script>
    <script>
        let selectedSeatId = null;

        function renderSeatTypes() {
            const grid = document.getElementById('seatGrid');
            grid.innerHTML = SEAT_TYPES.map(seat => `
                <div class="card" data-seat-id="${seat.id}" onclick="selectSeat(${seat.id})">
                    <div class="card-icon">🪑</div>
                    <div class="card-title">${seat.category}</div>
                    <div class="card-details">Comfortable seating</div>
                    <div class="card-price">Rs. ${seat.price}</div>
                </div>
            `).join('');
        }

        function selectSeat(seatId) {
            selectedSeatId = seatId;
            document.querySelectorAll('[data-seat-id]').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-seat-id="${seatId}"]`).classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
            updateRunningTotal();
        }

        function updateRunningTotal() {
            const booking = bookingManager.getBooking();
            booking.seatTypeId = selectedSeatId;
            const total = calculateTotal(booking);
            
            const seat = getSeatTypeById(selectedSeatId);
            const screen = getScreenTypeById(booking.screenTypeId);
            
            const totalDiv = document.getElementById('runningTotal');
            totalDiv.innerHTML = `
                <div class="summary-item">
                    <span class="summary-label">Seat (${seat.category}):</span>
                    <span class="summary-value">Rs. ${seat.price}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Screen (${screen.name}):</span>
                    <span class="summary-value">Rs. ${screen.price}</span>
                </div>
                <div class="summary-item summary-total">
                    <span class="summary-label">Subtotal:</span>
                    <span class="summary-value total-amount">Rs. ${total}</span>
                </div>
            `;
        }

        function goToNextStep() {
            bookingManager.updateBooking({ seatTypeId: selectedSeatId, food: [] });
            window.location.href = 'step5-food.html';
        }

        function goBack() {
            window.location.href = 'step3-screen.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const booking = bookingManager.getBooking();
            if (!booking.screenTypeId) {
                window.location.href = 'step3-screen.html';
                return;
            }
            if (booking.seatTypeId) {
                selectedSeatId = booking.seatTypeId;
            }
            renderSeatTypes();
            if (selectedSeatId) {
                document.querySelector(`[data-seat-id="${selectedSeatId}"]`).classList.add('selected');
                document.getElementById('nextBtn').disabled = false;
                updateRunningTotal();
            }
        });
    </script>
</body>
</html>
