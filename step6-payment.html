<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 6 - Select Payment | Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cinema Booking</h1>
            <p>Book your tickets online, enjoy your movie!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step completed" data-step="1">
                <div class="progress-circle">1</div>
                <div class="progress-label">Movie</div>
            </div>
            <div class="progress-step completed" data-step="2">
                <div class="progress-circle">2</div>
                <div class="progress-label">Timing</div>
            </div>
            <div class="progress-step completed" data-step="3">
                <div class="progress-circle">3</div>
                <div class="progress-label">Screen</div>
            </div>
            <div class="progress-step completed" data-step="4">
                <div class="progress-circle">4</div>
                <div class="progress-label">Seat</div>
            </div>
            <div class="progress-step completed" data-step="5">
                <div class="progress-circle">5</div>
                <div class="progress-label">Food</div>
            </div>
            <div class="progress-step active" data-step="6">
                <div class="progress-circle">6</div>
                <div class="progress-label">Payment</div>
            </div>
            <div class="progress-step" data-step="7">
                <div class="progress-circle">7</div>
                <div class="progress-label">Confirm</div>
            </div>
        </div>

        <div class="content">
            <h2>Select Payment Method</h2>
            <div class="info-box">
                <strong>ℹ️ Choose</strong> your preferred payment method and complete your booking.
            </div>

            <div class="grid" id="paymentGrid"></div>

            <!-- Discount Code Section -->
            <div class="summary" style="margin-top: 20px;">
                <h3>Discount Code (Optional)</h3>
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                    <input type="text" id="discountCode" placeholder="Enter discount code" 
                           style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em;">
                    <button onclick="applyDiscount()" class="btn-secondary" style="padding: 10px 20px;">Apply</button>
                </div>
                <div id="discountMessage" style="color: #28a745; font-weight: bold; margin-bottom: 10px;"></div>
            </div>

            <div class="summary">
                <h3>Order Summary</h3>
                <div id="orderSummary"></div>
            </div>

            <div class="button-group">
                <button class="btn-secondary" onclick="goBack()">← Back</button>
                <button class="btn-primary" id="checkoutBtn" onclick="checkout()" disabled>Checkout</button>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/booking.js"></script>
    <script>
        let selectedPaymentId = null;

        function renderPaymentMethods() {
            const grid = document.getElementById('paymentGrid');
            grid.innerHTML = PAYMENT_METHODS.map(payment => `
                <div class="card" data-payment-id="${payment.id}" onclick="selectPayment(${payment.id})">
                    <div class="card-icon">${payment.icon}</div>
                    <div class="card-title">${payment.name}</div>
                </div>
            `).join('');
        }

        function selectPayment(paymentId) {
            selectedPaymentId = paymentId;
            document.querySelectorAll('[data-payment-id]').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-payment-id="${paymentId}"]`).classList.add('selected');
            document.getElementById('checkoutBtn').disabled = false;
        }

        function renderOrderSummary() {
            const booking = bookingManager.getBooking();
            const movie = getMovieById(booking.movieId);
            const show = getShowById(booking.showId);
            const screen = getScreenTypeById(booking.screenTypeId);
            const seat = getSeatTypeById(booking.seatTypeId);

            let subtotal = seat.price + screen.price;
            let summary = `
                <div class="summary-item">
                    <span class="summary-label">Movie:</span>
                    <span class="summary-value">${movie.title}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Show Time:</span>
                    <span class="summary-value">${show.time} (${show.cinema})</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Screen:</span>
                    <span class="summary-value">${screen.name}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Seat Type:</span>
                    <span class="summary-value">${seat.category}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Seat Price:</span>
                    <span class="summary-value">Rs. ${seat.price}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Screen Charge:</span>
                    <span class="summary-value">Rs. ${screen.price}</span>
                </div>
            `;

            if (booking.food && booking.food.length > 0) {
                booking.food.forEach(food => {
                    const itemTotal = food.price * food.qty;
                    subtotal += itemTotal;
                    summary += `
                        <div class="summary-item">
                            <span class="summary-label">${food.name} (x${food.qty}):</span>
                            <span class="summary-value">Rs. ${itemTotal}</span>
                        </div>
                    `;
                });
            }

            // Show subtotal
            summary += `
                <div class="summary-item">
                    <span class="summary-label">Subtotal:</span>
                    <span class="summary-value">Rs. ${subtotal}</span>
                </div>
            `;

            // Show discount if applied
            if (booking.discountCode && booking.discountAmount > 0) {
                const discount = validateDiscountCode(booking.discountCode, booking.show?.date);
                summary += `
                    <div class="summary-item">
                        <span class="summary-label">Discount (${booking.discountCode}):</span>
                        <span class="summary-value" style="color: #28a745;">-Rs. ${booking.discountAmount}</span>
                    </div>
                `;
            }

            if (selectedPaymentId) {
                const payment = getPaymentMethodById(selectedPaymentId);
                summary += `
                    <div class="summary-item">
                        <span class="summary-label">Payment Method:</span>
                        <span class="summary-value">${payment.name}</span>
                    </div>
                `;
            }

            summary += `
                <div class="summary-item summary-total">
                    <span class="summary-label">Total Amount:</span>
                    <span class="summary-value total-amount">Rs. ${calculateTotal(booking)}</span>
                </div>
            `;

            document.getElementById('orderSummary').innerHTML = summary;
        }

        function applyDiscount() {
            const code = document.getElementById('discountCode').value.trim();
            const messageDiv = document.getElementById('discountMessage');
            
            if (!code) {
                messageDiv.textContent = 'Please enter a discount code';
                messageDiv.style.color = '#dc3545';
                return;
            }
            
            const discount = validateDiscountCode(code, bookingManager.getBooking().show?.date);
            if (discount) {
                bookingManager.updateBooking({ 
                    discountCode: code.toUpperCase(),
                    discountAmount: calculateDiscount(calculateTotal(bookingManager.getBooking()), code, bookingManager.getBooking().show?.date)
                });
                messageDiv.textContent = `✅ ${discount.description}`;
                messageDiv.style.color = '#28a745';
                renderOrderSummary();
            } else {
                messageDiv.textContent = '❌ Invalid discount code';
                messageDiv.style.color = '#dc3545';
                bookingManager.updateBooking({ discountCode: null, discountAmount: 0 });
            }
        }

        function checkout() {
            if (!selectedPaymentId) {
                alert('Please select a payment method');
                return;
            }
            
            // Update booking with payment method, total amount, and generate reference number
            const booking = bookingManager.getBooking();
            const totalAmount = calculateTotal(booking);
            
            bookingManager.updateBooking({
                paymentMethod: selectedPaymentId,
                totalAmount: totalAmount,
                refNumber: generateRefNumber(),
                timestamp: new Date().toISOString()
            });
            
            // Navigate to confirmation page
            window.location.href = 'step7-confirmation.html';
        }

        function goBack() {
            window.location.href = 'step5-food.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const booking = bookingManager.getBooking();
            if (!booking.seatTypeId) {
                window.location.href = 'step4-seat.html';
                return;
            }
            
            renderPaymentMethods();
            
            if (booking.paymentMethod) {
                selectedPaymentId = booking.paymentMethod;
                document.querySelector(`[data-payment-id="${selectedPaymentId}"]`).classList.add('selected');
                document.getElementById('checkoutBtn').disabled = false;
            }
            
            renderOrderSummary();
        });
    </script>
</body>
</html>
