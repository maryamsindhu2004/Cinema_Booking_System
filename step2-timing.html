<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 - Select Timing | Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cinema Booking</h1>
            <p>Book your tickets online, enjoy your movie!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step completed" data-step="1">
                <div class="progress-circle">1</div>
                <div class="progress-label">Movie</div>
            </div>
            <div class="progress-step active" data-step="2">
                <div class="progress-circle">2</div>
                <div class="progress-label">Timing</div>
            </div>
            <div class="progress-step" data-step="3">
                <div class="progress-circle">3</div>
                <div class="progress-label">Screen</div>
            </div>
            <div class="progress-step" data-step="4">
                <div class="progress-circle">4</div>
                <div class="progress-label">Seat</div>
            </div>
            <div class="progress-step" data-step="5">
                <div class="progress-circle">5</div>
                <div class="progress-label">Food</div>
            </div>
            <div class="progress-step" data-step="6">
                <div class="progress-circle">6</div>
                <div class="progress-label">Payment</div>
            </div>
            <div class="progress-step" data-step="7">
                <div class="progress-circle">7</div>
                <div class="progress-label">Confirm</div>
            </div>
        </div>

        <div class="content">
            <h2>Select Show Timing</h2>
            <div class="info-box">
                <strong>ℹ️ Choose</strong> a time slot for <span id="movieName"></span>.
            </div>

            <div class="grid" id="timingsGrid"></div>

            <div class="button-group">
                <button class="btn-secondary" onclick="goBack()">← Back</button>
                <button class="btn-primary" id="nextBtn" onclick="goToNextStep()" disabled>Next →</button>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/booking.js"></script>
    <script>
        let selectedShowId = null;

        function renderTimings() {
            const booking = bookingManager.getBooking();
            const movieShows = SHOWS.filter(s => s.movieId === booking.movieId);
            const movie = getMovieById(booking.movieId);
            
            document.getElementById('movieName').textContent = `"${movie.title}"`;
            
            const grid = document.getElementById('timingsGrid');
            grid.innerHTML = movieShows.map(show => `
                <div class="card" data-show-id="${show.id}" onclick="selectTiming(${show.id})">
                    <div class="card-icon">🎟️</div>
                    <div class="card-title">${show.time}</div>
                    <div class="card-details">${show.cinema}</div>
                    <div class="card-details">${show.date}</div>
                    <div class="card-details">Ends: ${show.endTime}</div>
                </div>
            `).join('');
        }

        function selectTiming(showId) {
            selectedShowId = showId;
            document.querySelectorAll('[data-show-id]').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-show-id="${showId}"]`).classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }

        function goToNextStep() {
            bookingManager.updateBooking({ showId: selectedShowId });
            window.location.href = 'step3-screen.html';
        }

        function goBack() {
            window.location.href = 'step1-movie.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const booking = bookingManager.getBooking();
            if (!booking.movieId) {
                window.location.href = 'step1-movie.html';
                return;
            }
            if (booking.showId) {
                selectedShowId = booking.showId;
            }
            renderTimings();
            if (selectedShowId) {
                document.querySelector(`[data-show-id="${selectedShowId}"]`).classList.add('selected');
                document.getElementById('nextBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
