<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 - Select Movie | Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cinema Booking</h1>
            <p>Book your tickets online, enjoy your movie!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step active" data-step="1">
                <div class="progress-circle">1</div>
                <div class="progress-label">Movie</div>
            </div>
            <div class="progress-step" data-step="2">
                <div class="progress-circle">2</div>
                <div class="progress-label">Timing</div>
            </div>
            <div class="progress-step" data-step="3">
                <div class="progress-circle">3</div>
                <div class="progress-label">Screen</div>
            </div>
            <div class="progress-step" data-step="4">
                <div class="progress-circle">4</div>
                <div class="progress-label">Seat</div>
            </div>
            <div class="progress-step" data-step="5">
                <div class="progress-circle">5</div>
                <div class="progress-label">Food</div>
            </div>
            <div class="progress-step" data-step="6">
                <div class="progress-circle">6</div>
                <div class="progress-label">Payment</div>
            </div>
            <div class="progress-step" data-step="7">
                <div class="progress-circle">7</div>
                <div class="progress-label">Confirm</div>
            </div>
        </div>

        <div class="content">
            <h2>Now Showing</h2>
            <div class="info-box">
                <strong>ℹ️ Select a movie</strong> from the options below to get started.
            </div>

            <div class="grid" id="moviesGrid"></div>

            <div class="button-group">
                <button class="btn-secondary" onclick="resetBooking()">Reset</button>
                <button class="btn-primary" id="nextBtn" onclick="goToNextStep()" disabled>Next →</button>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/booking.js"></script>
    <script>
        let selectedMovieId = null;

        function renderMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = MOVIES.map(movie => `
                <div class="card" data-movie-id="${movie.id}" onclick="selectMovie(${movie.id})">
                    <div class="card-icon">${movie.icon}</div>
                    <div class="card-title">${movie.title}</div>
                    <div class="card-details">${movie.genre}</div>
                    <div class="card-details">${movie.duration} min</div>
                    <div class="card-details">🌐 ${movie.language}</div>
                    <div class="card-details">${movie.rating}</div>
                </div>
            `).join('');
        }

        function selectMovie(movieId) {
            selectedMovieId = movieId;
            document.querySelectorAll('[data-movie-id]').forEach(el => {
                el.classList.remove('selected');
            });
            document.querySelector(`[data-movie-id="${movieId}"]`).classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }

        function goToNextStep() {
            bookingManager.updateBooking({ movieId: selectedMovieId });
            window.location.href = 'step2-timing.html';
        }

        function resetBooking() {
            if (confirm('Are you sure? This will clear all selections.')) {
                bookingManager.reset();
                window.location.href = 'step1-movie.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const booking = bookingManager.getBooking();
            if (booking.movieId) {
                selectedMovieId = booking.movieId;
            }
            renderMovies();
            if (selectedMovieId) {
                document.querySelector(`[data-movie-id="${selectedMovieId}"]`).classList.add('selected');
                document.getElementById('nextBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
