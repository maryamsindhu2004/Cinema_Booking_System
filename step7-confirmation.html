<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 7 - Confirmation | Cinema Booking</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Cinema Booking</h1>
            <p>Book your tickets online, enjoy your movie!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step completed" data-step="1">
                <div class="progress-circle">1</div>
                <div class="progress-label">Movie</div>
            </div>
            <div class="progress-step completed" data-step="2">
                <div class="progress-circle">2</div>
                <div class="progress-label">Timing</div>
            </div>
            <div class="progress-step completed" data-step="3">
                <div class="progress-circle">3</div>
                <div class="progress-label">Screen</div>
            </div>
            <div class="progress-step completed" data-step="4">
                <div class="progress-circle">4</div>
                <div class="progress-label">Seat</div>
            </div>
            <div class="progress-step completed" data-step="5">
                <div class="progress-circle">5</div>
                <div class="progress-label">Food</div>
            </div>
            <div class="progress-step completed" data-step="6">
                <div class="progress-circle">6</div>
                <div class="progress-label">Payment</div>
            </div>
            <div class="progress-step active" data-step="7">
                <div class="progress-circle">7</div>
                <div class="progress-label">Confirm</div>
            </div>
        </div>

        <div class="content">
            <div class="confirmation">
                <div class="confirmation-icon">✓</div>
                <h2 class="confirmation-title">Booking Confirmed!</h2>
                <p class="confirmation-message">
                    Your booking has been successfully completed.<br>
                    Please check your email for booking details and tickets.
                </p>

                <div class="booking-ref">
                    <div class="booking-ref-label">Booking Reference Number</div>
                    <div class="booking-ref-number" id="refNumber"></div>
                </div>

                <div class="summary">
                    <h3>Booking Details</h3>
                    <div id="bookingDetails"></div>
                </div>

                <div class="button-group">
                    <button class="btn-success" onclick="newBooking()">Book Another Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/booking.js"></script>
    <script>
        function displayBookingDetails() {
            const booking = bookingManager.getBooking();
            
            document.getElementById('refNumber').textContent = booking.refNumber;

            const movie = getMovieById(booking.movieId);
            const show = getShowById(booking.showId);
            const screen = getScreenTypeById(booking.screenTypeId);
            const seat = getSeatTypeById(booking.seatTypeId);
            const payment = getPaymentMethodById(booking.paymentMethod);

            let details = `
                <div class="summary-item">
                    <span class="summary-label">Movie:</span>
                    <span class="summary-value">${movie.title}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Show Time:</span>
                    <span class="summary-value">${show.time} (${show.cinema})</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Date:</span>
                    <span class="summary-value">${show.date}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Screen:</span>
                    <span class="summary-value">${screen.name}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Seat Type:</span>
                    <span class="summary-value">${seat.category}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Seat Price:</span>
                    <span class="summary-value">Rs. ${seat.price}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Screen Charge:</span>
                    <span class="summary-value">Rs. ${screen.price}</span>
                </div>
            `;

            if (booking.food && booking.food.length > 0) {
                booking.food.forEach(food => {
                    details += `
                        <div class="summary-item">
                            <span class="summary-label">${food.name} (x${food.qty}):</span>
                            <span class="summary-value">Rs. ${food.price * food.qty}</span>
                        </div>
                    `;
                });
            }

            // Show discount if applied
            if (booking.discountCode && booking.discountAmount > 0) {
                details += `
                    <div class="summary-item">
                        <span class="summary-label">Discount (${booking.discountCode}):</span>
                        <span class="summary-value" style="color: #28a745;">-Rs. ${booking.discountAmount}</span>
                    </div>
                `;
            }

            details += `
                <div class="summary-item">
                    <span class="summary-label">Payment Method:</span>
                    <span class="summary-value">${payment.name}</span>
                </div>
                <div class="summary-item summary-total">
                    <span class="summary-label">Total Amount Paid:</span>
                    <span class="summary-value total-amount">Rs. ${booking.totalAmount}</span>
                </div>
            `;

            document.getElementById('bookingDetails').innerHTML = details;
        }

        function newBooking() {
            if (confirm('Start a new booking? Your current booking data will be cleared.')) {
                bookingManager.reset();
                window.location.href = 'step1-movie.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const booking = bookingManager.getBooking();
            if (!booking.paymentMethod || !booking.refNumber) {
                window.location.href = 'step6-payment.html';
                return;
            }
            displayBookingDetails();
        });
    </script>
</body>
</html>
